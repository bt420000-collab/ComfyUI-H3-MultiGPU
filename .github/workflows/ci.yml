name: H3VM v0.21.1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile public release sources
        run: |
          python -m py_compile __init__.py h3vm/__init__.py h3vm/core_adapter.py h3vm/core_adapter_base.py h3vm/master_console.py h3vm/loader.py h3vm/v0211_mode4.py h3vm/compiler_guard.py h3vm/gpu_preflight.py h3vm/dual_video_vae.py
      - name: Run v0.21.1 contracts
        env:
          PYTHONPATH: .
        run: |
          python tests/test_v0211_release_contract.py
          python tests/test_gpu_preflight_contract.py
