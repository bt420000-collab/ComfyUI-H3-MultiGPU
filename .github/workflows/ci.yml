name: H3VM Core CI

on:
  push:
    branches: [main, 'lab/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile H3 VRAM Master public runtime
        run: |
          python -m py_compile __init__.py base_runtime.py h3vm/__init__.py h3vm/core_adapter.py h3vm/core_adapter_base.py h3vm/gpu_preflight.py h3vm/comfy_kitchen_multigpu.py h3vm/loader.py h3vm/loader_base.py h3vm/master_console.py h3vm/style_lora.py h3vm/sequence_partition.py h3vm/quant_shard.py h3vm/compute_planner.py h3vm/exact_sp_lab.py h3vm/vram_master_fusion.py h3vm/capacity_quantized_qkv.py scripts/qkv_quantized_parity.py scripts/dual_gpu_probe.py
      # Run lightweight assert-based contracts as scripts. This avoids pytest
      # treating the ComfyUI custom-node root __init__.py as a top-level package.
      - name: Run public runtime contracts directly
        env:
          PYTHONPATH: .
        run: |
          python tests/test_core_adapter_contract.py
          python tests/test_public_core_contract.py
          python tests/test_style_lora_contract.py
          python tests/test_gpu_preflight_contract.py
          python tests/test_comfy_kitchen_multigpu_contract.py
          python tests/test_sequence_partition_contract.py
          python tests/test_quant_shard_contract.py
          python tests/test_compute_planner_contract.py
          python tests/test_exact_sp_lab_contract.py
          python tests/test_capacity_quantized_qkv_contract.py
          python tests/test_brand_contract.py
          python tests/test_fusion_docs_contract.py
          python tests/test_product_name_contract.py
