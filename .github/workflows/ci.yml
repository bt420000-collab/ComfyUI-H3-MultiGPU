name: H3VM Core CI

on:
  push:
    branches: [main, 'lab/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile H3 VRAM Master public runtime
        run: |
          python -m py_compile __init__.py base_runtime.py h3vm/__init__.py h3vm/core_adapter.py h3vm/core_adapter_base.py h3vm/gpu_preflight.py h3vm/comfy_kitchen_multigpu.py h3vm/loader.py h3vm/loader_base.py h3vm/master_console.py h3vm/style_lora.py h3vm/sequence_partition.py h3vm/quant_shard.py h3vm/compute_planner.py h3vm/exact_sp_lab.py h3vm/exact_sp_exchange.py h3vm/vram_master_fusion.py h3vm/capacity_quantized_qkv.py h3vm/relay_packet.py h3vm/attention_relay_packet.py h3vm/segmented_relay.py scripts/qkv_quantized_parity.py scripts/dual_gpu_probe.py scripts/vram_master_plan_probe.py scripts/relay_packet_benchmark.py scripts/exact_sp_exchange_probe.py
      - name: Run public runtime contracts directly
        env:
          PYTHONPATH: .
        run: |
          python tests/test_core_adapter_contract.py
          python tests/test_public_core_contract.py
          python tests/test_style_lora_contract.py
          python tests/test_gpu_preflight_contract.py
          python tests/test_comfy_kitchen_multigpu_contract.py
          python tests/test_sequence_partition_contract.py
          python tests/test_quant_shard_contract.py
          python tests/test_compute_planner_contract.py
          python tests/test_exact_sp_lab_contract.py
          python tests/test_exact_sp_exchange_contract.py
          python tests/test_capacity_quantized_qkv_contract.py
          python tests/test_relay_packet_contract.py
          python tests/test_segmented_relay_contract.py
          python tests/test_relay_overlay_contract.py
          python tests/test_brand_contract.py
          python tests/test_fusion_docs_contract.py
          python tests/test_product_name_contract.py
      - name: Build install package
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/ComfyUI-H3-VRAM-Master
          cp __init__.py base_runtime.py requirements.txt LICENSE THIRD_PARTY_NOTICES.md VERSION dist/ComfyUI-H3-VRAM-Master/
          cp README.md README_EN.md BRAND_H3_VRAM_MASTER.md H3VM_PRODUCT_NAME H3VM_FUSION_ROADMAP.md dist/ComfyUI-H3-VRAM-Master/
          cp -r h3vm web third_party scripts dist/ComfyUI-H3-VRAM-Master/
          find dist/ComfyUI-H3-VRAM-Master -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find dist/ComfyUI-H3-VRAM-Master -type f -name '*.pyc' -delete || true

          cp example_workflows/H3VM_Dual_Quiet_Example.json 'dist/工作流_01_全功能_H3_VRAM_Master.json'
          cp example_workflows/video_minimax_h3_t2v_H3VM_Core_DualQuiet.json 'dist/工作流_02_快速替换原Loader_H3VM_Core.json'

          cat > 'dist/安装与工作流说明.txt' <<'EOF'
          ComfyUI-H3-VRAM-Master
          ======================

          安装：
          1. 关闭 ComfyUI。
          2. 将 ComfyUI-H3-VRAM-Master 文件夹复制到 ComfyUI/custom_nodes/。
          3. 不要同时保留旧的 ComfyUI-H3-MultiGPU 插件目录，避免重复节点/运行时桥冲突。
          4. 启动 ComfyUI。

          标准工作流：
          1. 工作流_01_全功能_H3_VRAM_Master.json
             使用 H3VM Master Loader，一套节点统一控制模型、模式、步数、尺寸、Seed、Sampler 与 H3VM Video VAE。
             适合直接使用 H3 VRAM Master 全功能。

          2. 工作流_02_快速替换原Loader_H3VM_Core.json
             保留公版 MiniMax H3 工作流主体，只在 MODEL 路径插入 H3VM Core（MODEL -> H3VM -> MODEL）。
             适合已有工作流快速接入，不改 Prompt、Seed、分辨率、Sampler、Sigmas 和实际 Steps。

          当前融合分支：lab/h3-vram-master-fusion-v1
          H3VM = H3 VRAM Master

          当前融合技术：
          - 双16G Mode4 25/25 硬件感知规划
          - Capacity Quantized-QKV 原生切片 + dense fail-safe
          - Host Attention 六路传输合并为单 packet relay
          - bounded pinned 双缓冲 segmented relay（失败自动退回旧路径）
          - Exact-SP sequence/head exchange fabric 与真机 parity probe
          EOF
      - name: Upload install package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUI-H3-VRAM-Master-PACK
          path: dist/*
          if-no-files-found: error
          retention-days: 14
