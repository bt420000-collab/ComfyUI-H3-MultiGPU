name: Publish H3VM RC source

on:
  push:
    paths:
      - 'H3VM-v0.20.0-rc1-clean.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack verified RC archive
        shell: bash
        run: |
          set -euo pipefail
          test -f H3VM-v0.20.0-rc1-clean.zip
          mkdir -p /tmp/h3vm-src
          unzip -q H3VM-v0.20.0-rc1-clean.zip -d /tmp/h3vm-src
          cp -a /tmp/h3vm-src/. ./
          rm -f H3VM-v0.20.0-rc1-clean.zip
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap_source.yml

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish H3VM v0.20.0-rc1 source tree"
          git push
