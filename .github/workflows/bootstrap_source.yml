name: Bootstrap H3VM source tree

on:
  push:
    paths:
      - '.bootstrap/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified RC source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part*.b64 > /tmp/h3vm-source.b64
          base64 -d /tmp/h3vm-source.b64 > /tmp/h3vm-source.zip
          mkdir -p /tmp/h3vm-src
          unzip -q /tmp/h3vm-source.zip -d /tmp/h3vm-src
          cp -a /tmp/h3vm-src/. ./
          rm -rf .bootstrap

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Publish H3VM v0.20.0-rc1 source tree"
          git push
